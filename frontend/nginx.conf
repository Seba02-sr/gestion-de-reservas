server {
  # 8080: nginx corre sin root (nginx-unprivileged), no puede abrir el 80
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # --- Proxy hacia el API Gateway (misma origen que el front => no hace falta CORS) ---
  # El navegador llama a /api/<servicio>/...; nginx quita /api y reenvía al gateway por la red de Docker.
  # Ej.: GET /api/gestion/hoteles  ->  http://gateway:8080/gestion/hoteles
  # resolver + variable: nginx resuelve "gateway" en cada pedido (arranca aunque el gateway todavía no esté).
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway_upstream http://gateway:8080;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $gateway_upstream;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    # si el gateway no responde, el front recibe un 502/504 (lo muestra como "servicio no disponible")
  }

  # Static assets cache
  location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|webp)$ {
    try_files $uri =404;
    expires 7d;
    access_log off;
  }

  # HTML5 history mode fallback for SPA
  location / {
    try_files $uri /index.html;
  }
}
