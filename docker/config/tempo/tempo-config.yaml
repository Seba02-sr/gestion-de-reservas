# Tempo (trazas), un solo proceso. Recibe OTLP del collector en 4317/4318 y se consulta por 3200.
# Ninguno de estos puertos se publica en el host: Grafana y el collector lo alcanzan por la red de Docker.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 72h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
