# Crea al arrancar el broker el usuario admin/admin (de demo), el exchange dan.exchange, la cola
# habitacion.topic y su binding. gestion-svc publica y reservas-svc consume: así los eventos de
# habitaciones esperan en la cola aunque reservas-svc arranque después.
# OJO: al importar definiciones RabbitMQ NO crea el usuario de RABBITMQ_DEFAULT_USER/PASS; por eso el
# usuario va en definitions.json (contraseña "admin", hash SHA-256 con sal).
load_definitions = /etc/rabbitmq/definitions.json
