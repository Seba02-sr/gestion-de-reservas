# Perfil `eureka`: el gateway se registra en Eureka y enruta con lb:// (balanceo del lado del cliente).
eureka.client.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://dan-eureka-server:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${HOSTNAME:local}

# Las rutas se repiten completas a propósito: Spring Boot enlaza una lista indexada desde UNA sola
# fuente de propiedades, así que no alcanza con pisar solo el `uri` de application.properties.
# lb://<nombre> = "pedile a Eureka las instancias de <nombre> y repartí entre ellas".
spring.cloud.gateway.server.webmvc.routes[0].id=user-svc
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://user-svc
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/users/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[1].id=reservas-svc
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://reservas-svc
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/reservas/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[2].id=gestion-svc
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://gestion-svc
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/gestion/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

# SOLO DESARROLLO: ver rápido las instancias nuevas/caídas (por defecto el registro se refresca
# cada 30 s y el balanceador cachea 35 s). En producción se dejan los valores por defecto.
eureka.client.registry-fetch-interval-seconds=5
spring.cloud.loadbalancer.cache.ttl=5s
