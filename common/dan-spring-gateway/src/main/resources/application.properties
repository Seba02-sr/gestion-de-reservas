spring.application.name=gateway
server.port=8080
spring.main.web-application-type=servlet
spring.cloud.gateway.server.webmvc.enabled=true

# Origenes permitidos por CORS (el frontend en Vite/nginx escucha en 5173)
gateway.cors.allowed-origins=${GATEWAY_CORS_ORIGINS:http://localhost:5173,http://localhost:5174}

# Cada ruta: id + uri destino (nombre DNS del servicio en la red de docker) + predicate + filter.
# StripPrefix=1 quita el primer segmento: /gestion/hoteles -> /hoteles
spring.cloud.gateway.server.webmvc.routes[0].id=user-svc
spring.cloud.gateway.server.webmvc.routes[0].uri=${USER_SVC_URL:http://user-svc:8080}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/users/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[1].id=reservas-svc
spring.cloud.gateway.server.webmvc.routes[1].uri=${RESERVAS_SVC_URL:http://reservas-svc:8080}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/reservas/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[2].id=gestion-svc
spring.cloud.gateway.server.webmvc.routes[2].uri=${GESTION_SVC_URL:http://gestion-svc:8080}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/gestion/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

# Service discovery: apagado por defecto. Con el perfil `eureka` las rutas pasan a lb://
eureka.client.enabled=false

# ── Swagger UI unificado ─────────────────────────────────────────────────────
# Un solo Swagger en http://localhost:8080/swagger-ui.html con un desplegable por servicio.
# Cada documento OpenAPI se pide por el propio gateway (/users/v3/api-docs -> user-svc /v3/api-docs).
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=user-svc
springdoc.swagger-ui.urls[0].url=/users/v3/api-docs
springdoc.swagger-ui.urls[1].name=gestion-svc
springdoc.swagger-ui.urls[1].url=/gestion/v3/api-docs
springdoc.swagger-ui.urls[2].name=reservas-svc
springdoc.swagger-ui.urls[2].url=/reservas/v3/api-docs

# ── Observabilidad (Etapa 5) ─────────────────────────────────────────────────
# Actuator: SOLO lo mínimo. Nada de env/beans/heapdump y el shutdown está deshabilitado.
# En docker el compose define MANAGEMENT_SERVER_PORT=9091: actuator escucha en un puerto aparte que
# no se publica en el host ni lo enruta el gateway (Prometheus lo lee por la red de Docker).
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.shutdown.access=none
management.endpoint.health.show-details=never
# Métricas (Prometheus las raspa de /actuator/prometheus)
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Trazas y logs por OTLP hacia el OpenTelemetry Collector. Apagado por defecto (tests, IDE):
# el compose lo enciende con MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED / MANAGEMENT_OTLP_LOGGING_EXPORT_ENABLED.
management.tracing.sampling.probability=${TRACING_SAMPLING:1.0}
management.otlp.tracing.endpoint=${OTEL_COLLECTOR_URL:http://otel-collector:4318}/v1/traces
management.otlp.tracing.export.enabled=false
management.otlp.logging.endpoint=${OTEL_COLLECTOR_URL:http://otel-collector:4318}/v1/logs
management.otlp.logging.export.enabled=false
