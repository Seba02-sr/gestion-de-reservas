spring.application.name=dan-eureka-server
server.port=8761

# El server no se registra ni descarga el registro de sí mismo
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# SOLO DESARROLLO: sin self-preservation y con expulsión rápida, para ver enseguida
# cómo desaparece una instancia caída. En producción se dejan los valores por defecto.
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000

management.endpoints.web.exposure.include=health,info
