spring.application.name=reservas-svc
spring.data.mongodb.uri=mongodb://root:rootpwd@mongodb:27017/reservas?authSource=admin

# Configuración de RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin
spring.amqp.deserialization.trust.all=true

logging.level.edu.utn.frsf.isi.dan.reservas_svc=DEBUG

# Zona horaria de negocio: el "hoy" de las reservas y las fechas de check-in/check-out
app.zone=America/Argentina/Buenos_Aires
# Solo para pruebas manuales: fija "hoy" (yyyy-MM-dd). Vacía = fecha real.
# Con docker compose: variable de entorno APP_FECHA_ACTUAL
app.fecha-actual=

# Crea los índices de MongoDB (2dsphere hotel.ubicacion, habitacionId único) al arrancar
reservas.crear-indices=true

# Service discovery: apagado por defecto (tests, IDE). Se activa con el perfil `eureka` (docker compose)
eureka.client.enabled=false

# ── Llamadas a otros servicios (OpenFeign) ────────────────────────────────────
# Con el perfil `eureka` se resuelven por nombre (user-svc, gestion-svc). Sin Eureka (IDE, tests)
# se puede fijar una URL:  clients.user-svc.url=http://localhost:8081  clients.gestion-svc.url=http://localhost:8083
clients.user-svc.url=
clients.gestion-svc.url=
# Timeouts (ms): si el otro servicio no responde a tiempo, la reserva falla con 503 (no cuelga)
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

# Circuit breaker (Resilience4j) alrededor de cada llamada Feign
spring.cloud.openfeign.circuitbreaker.enabled=true
# Los timeouts ya los maneja Feign; se evita el TimeLimiter por defecto (1 s) de Resilience4j
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true
# Se abre si falla >= 50 % de las últimas 10 llamadas (mínimo 5); a los 10 s pasa a half-open
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
# Un 404 (el huésped no existe) es una respuesta normal del servicio, no un fallo del servicio
resilience4j.circuitbreaker.configs.default.ignore-exceptions=feign.FeignException$NotFound