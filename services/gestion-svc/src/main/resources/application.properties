spring.application.name=gestion-svc
spring.datasource.url=jdbc:postgresql://postgres-db:5432/appdb
spring.datasource.username=appuser
spring.datasource.password=apppwd
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración de RabbitMQ para JMS de HabitacionService
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin

rabbitmq.exchange=dan.exchange
# Las routing keys se arman como <prefijo>.<accion> (dan.habitacion.crear, ...) y matchean el
# binding dan.habitacion.# de la cola habitacion.topic
rabbitmq.routingkey.prefix=dan.habitacion

logging.level.edu.utn.frsf.isi.dan.gestion=DEBUG

# Zona horaria de negocio ("hoy" para tarifas) y tarea diaria que publica los cambios de precio
app.zone=America/Argentina/Buenos_Aires
# cron de Spring (seg min hora día mes día-semana): por defecto todos los días a las 00:05
tarifas.cron-cambio-precio=0 5 0 * * *

# Datos de demo (hoteles, amenities, tarifas y habitaciones de 6 ciudades). Apagado por defecto (tests, IDE);
# el compose lo enciende con DEMO_DATOS_HABILITADO=true. Idempotente: no duplica nada si ya existen.
demo.datos.habilitado=${DEMO_DATOS_HABILITADO:false}

# Service discovery: apagado por defecto (tests, IDE). Se activa con el perfil `eureka` (docker compose)
eureka.client.enabled=false

# ── Observabilidad (Etapa 5) ─────────────────────────────────────────────────
# Actuator: SOLO lo mínimo. Nada de env/beans/heapdump y el shutdown está deshabilitado.
# En docker el compose define MANAGEMENT_SERVER_PORT=9091: actuator escucha en un puerto aparte que
# no se publica en el host ni lo enruta el gateway (Prometheus lo lee por la red de Docker).
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.shutdown.access=none
management.endpoint.health.show-details=never
# Métricas (Prometheus las raspa de /actuator/prometheus)
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Trazas y logs por OTLP hacia el OpenTelemetry Collector. Apagado por defecto (tests, IDE):
# el compose lo enciende con MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED / MANAGEMENT_OTLP_LOGGING_EXPORT_ENABLED.
management.tracing.sampling.probability=${TRACING_SAMPLING:1.0}
management.otlp.tracing.endpoint=${OTEL_COLLECTOR_URL:http://otel-collector:4318}/v1/traces
management.otlp.tracing.export.enabled=false
management.otlp.logging.endpoint=${OTEL_COLLECTOR_URL:http://otel-collector:4318}/v1/logs
management.otlp.logging.export.enabled=false
