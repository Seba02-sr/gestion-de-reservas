# Perfil `eureka`: el servicio se registra en Eureka y descubre a los demás por nombre
eureka.client.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://dan-eureka-server:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
# HOSTNAME = id del contenedor: distinto en cada réplica al escalar con --scale
eureka.instance.instance-id=${spring.application.name}:${HOSTNAME:local}
