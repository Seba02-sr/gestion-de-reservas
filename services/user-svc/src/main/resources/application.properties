spring.application.name=user-svc

# ── springdoc-openapi ─────────────────────────────────────────────

# Swagger UI
# springdoc.swagger-ui.path=/swagger-ui                 # URL: http://localhost:8080/docs
# springdoc.swagger-ui.operations-sorter=method   # Ordena operaciones por verbo HTTP
# springdoc.swagger-ui.enabled=true

# # JSON/YAML OpenAPI
# springdoc.api-docs.path=/openapi.json             # URL: http://localhost:8080/openapi.json
# springdoc.api-docs.enabled=true

# ── Configuración MySQL ──────────────────────────────
spring.datasource.url=jdbc:mysql://mysql:3306/users?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=usr_app
spring.datasource.password=usrapp
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ── Configuración Hikari ──────────────────────────────
spring.datasource.hikari.minimumIdle=2
spring.datasource.hikari.maximumPoolSize=8

# ── Configuración Hibernate ──────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Google OAuth (Client ID)
# Define GOOGLE_CLIENT_ID como variable de entorno o coloca el valor aquí
google.oauth.clientId=${GOOGLE_CLIENT_ID:}

# Service discovery: apagado por defecto (tests, IDE). Se activa con el perfil `eureka` (docker compose)
eureka.client.enabled=false

# ── Observabilidad (Etapa 5) ─────────────────────────────────────────────────
# Actuator: SOLO lo mínimo. Nada de env/beans/heapdump y el shutdown está deshabilitado.
# En docker el compose define MANAGEMENT_SERVER_PORT=9091: actuator escucha en un puerto aparte que
# no se publica en el host ni lo enruta el gateway (Prometheus lo lee por la red de Docker).
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.shutdown.access=none
management.endpoint.health.show-details=never
# Métricas (Prometheus las raspa de /actuator/prometheus)
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Trazas y logs por OTLP hacia el OpenTelemetry Collector. Apagado por defecto (tests, IDE):
# el compose lo enciende con MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED / MANAGEMENT_OTLP_LOGGING_EXPORT_ENABLED.
management.tracing.sampling.probability=${TRACING_SAMPLING:1.0}
management.otlp.tracing.endpoint=${OTEL_COLLECTOR_URL:http://otel-collector:4318}/v1/traces
management.otlp.tracing.export.enabled=false
management.otlp.logging.endpoint=${OTEL_COLLECTOR_URL:http://otel-collector:4318}/v1/logs
management.otlp.logging.export.enabled=false
# user-svc no loguea por su cuenta: con esto cada pedido deja una línea (con su traceId) que se ve en Loki
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
