# Variables comunes de observabilidad de los servicios Spring (Etapa 5).
#  - MANAGEMENT_SERVER_PORT: el actuator escucha en 9091, un puerto aparte que no se publica en el host
#    ni enruta el gateway (Prometheus lo lee por la red de Docker).
#  - Export OTLP (trazas y logs) hacia el OpenTelemetry Collector: encendido por defecto; si no se
#    levanta el profile `observability` la app funciona igual. OTEL_EXPORT_ENABLED=false lo apaga.
x-observabilidad: &observabilidad
  MANAGEMENT_SERVER_PORT: "9091"
  MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-true}
  MANAGEMENT_OTLP_LOGGING_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-true}

# Tope de heap de las JVM (ver "Memoria" en CLAUDE.md). MaxRAMPercentage se calcula sobre mem_limit.
x-jvm-servicio: &jvm-servicio
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65 -XX:+UseSerialGC -Xss512k"
x-jvm-liviana: &jvm-liviana
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k"

services:
  # ──────────────────────────────────────────────────────────────────────────────
  # Frontend (desarrollo): Vite con HMR en 5173 (el 8080 es del API Gateway)
  frontend:
    profiles: ["frontend"]
    image: node:20-alpine
    working_dir: /app
    command: sh -c "rm -f package-lock.json && npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"  # http://localhost:5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
  # ──────────────────────────────────────────────────────────────────────────────
  # Frontend (producción): Nginx sirviendo el build
  # Activar con: `docker compose --profile prod up -d` o COMPOSE_PROFILES=prod
  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: reservas-arn-frontend:latest
    container_name: reservas-arn-frontend
    ports:
      - "5173:80" # http://localhost:5173
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────────────
  # Infraestructura (DBs, MQ) con perfiles por microservicio para habilitarlos a demanda
  # Nota: RabbitMQ figura en múltiples perfiles porque lo usan varios servicios
  mysql:
    image: mysql:8.3
    container_name: mysql-users
    restart: unless-stopped
    profiles: ["infra", "user"]
    environment:
      MYSQL_DATABASE: users
      MYSQL_USER: usr_app
      MYSQL_PASSWORD: usrapp
      MYSQL_ROOT_PASSWORD: rootpwd
      TZ: America/Argentina/Cordoba
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    profiles: ["infra", "user"]
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "6080:80"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # Configuración para auto-login (solo desarrollo)
      - ./infra/phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro

  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: unless-stopped
    profiles: ["infra", "gestion"]
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppwd
      TZ: America/Argentina/Cordoba
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/initdb/:/docker-entrypoint-initdb.d/:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      retries: 5
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    profiles: ["infra", "gestion"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "6081:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/pgadmin/config/servers/:/pgadmin4/servers/
      - pgadmin_data:/var/lib/pgadmin

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    profiles: ["infra", "user", "reservas", "gestion"]
    ports:
      - "5672:5672"   # aplicaciones
      - "15672:15672" # consola web
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running", "-q"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    profiles: ["infra", "reservas"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpwd
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    profiles: ["infra", "reservas"]
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: rootpwd
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "6091:8081"
    depends_on:
      mongodb:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────────────────────────
  # Service discovery (Eureka Server). Dashboard: http://localhost:8761
  # Figura en los perfiles de todos los servicios que se registran en él.
  dan-eureka-server:
    build:
      context: ./common/dan-eureka-server
    container_name: dan-eureka-server
    restart: unless-stopped
    profiles: ["eureka", "user", "reservas", "gestion", "gateway"]
    ports:
      - "8761:8761"
    mem_limit: 384m
    environment:
      <<: *jvm-liviana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP"]
      interval: 10s
      retries: 10
      start_period: 20s

  # Microservicios (Spring Boot JAR ya construido en `services/*/target/*.jar`)
  # Sin container_name ni puertos del host: así se pueden escalar (`docker compose up -d --scale
  # gestion-svc=3`). Se llega a ellos por el API Gateway (http://localhost:8080) y se registran en Eureka.
  user-svc:
    build:
      context: ./services/user-svc
    restart: unless-stopped
    profiles: ["user"]
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      dan-eureka-server:
        condition: service_healthy
    mem_limit: 512m
    environment:
      <<: [*observabilidad, *jvm-servicio]
      SPRING_PROFILES_ACTIVE: eureka
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}

  reservas-svc:
    build:
      context: ./services/reservas-svc
    restart: unless-stopped
    profiles: ["reservas"]
    expose:
      - "8080"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      dan-eureka-server:
        condition: service_healthy
    mem_limit: 512m
    environment:
      <<: [*observabilidad, *jvm-servicio]
      SPRING_PROFILES_ACTIVE: eureka
      # Solo para pruebas: fija "hoy" (yyyy-MM-dd). Vacío = fecha real. Ver CLAUDE.md
      APP_FECHA_ACTUAL: ${APP_FECHA_ACTUAL:-}

  gestion-svc:
    build:
      context: ./services/gestion-svc
    restart: unless-stopped
    profiles: ["gestion"]
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      dan-eureka-server:
        condition: service_healthy
    mem_limit: 512m
    environment:
      <<: [*observabilidad, *jvm-servicio]
      SPRING_PROFILES_ACTIVE: eureka

  # API Gateway (Spring Cloud Gateway WebMVC): único punto de entrada en http://localhost:8080
  #   /users/**    -> user-svc:8080      /gestion/** -> gestion-svc:8080      /reservas/** -> reservas-svc:8080
  # Con el perfil de Spring `eureka` las rutas son lb://user-svc, lb://gestion-svc y lb://reservas-svc:
  # el gateway le pregunta a Eureka qué instancias hay y reparte entre ellas (soporta --scale).
  # required: false => no falla si algún perfil de servicio no está activo.
  gateway:
    build:
      context: ./common/dan-spring-gateway
    container_name: dan-spring-gateway
    restart: unless-stopped
    profiles: ["gateway"]
    ports:
      - "8080:8080"
    depends_on:
      user-svc:
        condition: service_started
        required: false
      reservas-svc:
        condition: service_started
        required: false
      gestion-svc:
        condition: service_started
        required: false
      dan-eureka-server:
        condition: service_healthy
    mem_limit: 384m
    environment:
      <<: [*observabilidad, *jvm-liviana]
      SPRING_PROFILES_ACTIVE: eureka

  # ──────────────────────────────────────────────────────────────────────────────
  # Observabilidad (Etapa 5) — profile `observability`
  #   servicios --OTLP--> otel-collector --> Tempo (trazas) / Loki (logs)      (push)
  #   Prometheus --scrape /actuator/prometheus:9091 (descubre réplicas en Eureka)  (pull)
  #   Grafana lee de Prometheus, Loki y Tempo.  UI: Grafana :3000, Prometheus :9090
  # Loki y Tempo no se publican en el host: se consultan desde Grafana.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    container_name: otel-collector
    restart: unless-stopped
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (servicios corriendo fuera de docker)
      - "4318:4318"   # OTLP HTTP
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 200MiB

  tempo:
    image: grafana/tempo:2.10.10
    container_name: tempo
    restart: unless-stopped
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo-config.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    mem_limit: 384m
    environment:
      GOMEMLIMIT: 300MiB

  loki:
    image: grafana/loki:3.6.19
    container_name: loki
    restart: unless-stopped
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    mem_limit: 384m
    environment:
      GOMEMLIMIT: 300MiB

  prometheus:
    image: prom/prometheus:v3.13.5
    container_name: prometheus
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      dan-eureka-server:
        condition: service_started
        required: false
    mem_limit: 512m
    environment:
      GOMEMLIMIT: 400MiB
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  grafana:
    image: grafana/grafana:12.4.14
    container_name: grafana
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}   # solo desarrollo
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GOMEMLIMIT: 300MiB
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    mem_limit: 384m

volumes:
  mysql_data:
  postgres_data:
  mongo_data:
  pgadmin_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
