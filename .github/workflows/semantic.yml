name: Semantic Pull Request Check

on:
  pull_request:
    branches:
      - "**"

jobs:
  check-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        with:
          titlePattern: '^\\d{4}-(t|rfe|qa|extra)-i\\d+-[a-z0-9-]+$'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
