name: CI/CD Pipeliine for Spring Boot

on:
  push:
    branches:
      - "**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Ejecuta en un entorno Ubuntu

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Descarga el código del repositorio

      - name: Set up JDK 21
        uses: actions/setup-java@v4 # Configura el JDK de Java 21
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven" # Habilita el caché de dependencias de Maven para acelerar builds
      - name: Build with Maven
        run: mvn clean package -DskipTests # Compila el proyecto

      - name: Run Unit and Integration Tests
        run: mvn test # Ejecuta todos los tests (unitarios y de integración)

      - name: Upload test results
        uses: actions/upload-artifact@v4 # Sube los resultados de los tests como un artefacto
        with:
          name: test-results
          path: target/surefire-reports/ # Ruta a los informes de Surefire (tests unitarios)
