name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Maven Tests (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Spotless check (format)
        run: mvn -B -ntp -Pci -Dspotless.ratchetFrom=origin/${{ github.event.repository.default_branch }} spotless:check

      - name: Run tests
        run: mvn -B -ntp test

  frontend:
    name: Frontend (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker-build:
    name: Docker (valida el compose y construye las imágenes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar docker/docker-compose.yml (con todos los perfiles) y el include de la raíz
        run: |
          docker compose -f docker/docker-compose.yml --profile observability --profile tools --profile dev config -q
          docker compose config -q

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # Construye las 6 imágenes propias (backend multi-etapa x5 + frontend). No levanta el stack.
      # El cache de GitHub Actions evita recompilar todo en cada ejecución.
      - name: Build de las imágenes (docker/backend.Dockerfile y docker/frontend.Dockerfile)
        uses: docker/bake-action@v6
        env:
          # El contexto del compose (..) queda fuera de docker/: bake pide permiso explícito para leerlo
          BUILDX_BAKE_ENTITLEMENTS_FS: 0
        with:
          # Bake resuelve los paths del compose relativos a este directorio (compose lo hace respecto del
          # archivo): desde la raíz, "context: .." apuntaría fuera del repo ("lstat ../docker").
          workdir: ./docker
          files: docker-compose.yml
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

  dependency-review:
    name: Dependency Review (PRs)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Review dependencies
        uses: actions/dependency-review-action@v4
